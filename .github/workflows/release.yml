name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  packagePath: Packages/com.kura.actionmanager

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        run: echo "value=$(jq -r .version ${packagePath}/package.json)" >> "$GITHUB_OUTPUT"

      - name: Zip package
        run: |
          cd "${packagePath}"
          zip -r "${GITHUB_WORKSPACE}/com.kura.actionmanager-${{ steps.version.outputs.value }}.zip" .

      - name: Track package meta files
        run: find "${packagePath}/" -name "*.meta" >> metaList

      - name: Build unitypackage
        uses: pCYSl5EDgo/create-unitypackage@v1.2.3
        with:
          package-path: com.kura.actionmanager-${{ steps.version.outputs.value }}.unitypackage
          include-files: metaList

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            com.kura.actionmanager-${{ steps.version.outputs.value }}.zip
            com.kura.actionmanager-${{ steps.version.outputs.value }}.unitypackage

      - name: Rebuild VPM listing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build-listing.yml --ref main
            ${{ env.packagePath }}/package.json
